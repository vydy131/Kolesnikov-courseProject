services:
  postgres:
    image: postgres:15-alpine
    container_name: investagg-postgres
    environment:
      POSTGRES_DB: investagg
      POSTGRES_USER: investagg
      POSTGRES_PASSWORD: investagg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investagg -d investagg"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: investagg-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@investagg.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
