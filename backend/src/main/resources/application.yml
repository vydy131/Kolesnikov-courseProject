spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investagg}
    username: ${DB_USER:investagg}
    password: ${DB_PASSWORD:investagg}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # schema managed by Flyway — never auto-create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false         # avoid lazy-loading pitfalls in controllers

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  security:
    filter:
      order: 10

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never      # never leak internal messages
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}    # 1 hour
  aes:
    key: ${AES_KEY:0123456789abcdef0123456789abcdef}  # 32-byte key for AES-256

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.investagg: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
